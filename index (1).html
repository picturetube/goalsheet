<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Goal Sheets</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Inter','Segoe UI',system-ui,-apple-system,sans-serif;background:#f5f5fc;display:flex;flex-direction:column;overflow:hidden}
.topbar{position:relative;height:64px;flex:0 0 64px;background:linear-gradient(100deg,#312e81 0%,#4f46e5 50%,#0891b2 100%);display:flex;align-items:center;gap:20px;padding:0 28px;box-shadow:0 10px 30px rgba(3,10,24,.55);z-index:10}
.topbar::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:linear-gradient(90deg,#2f6bd0 0%,#19b4c9 50%,#2f6bd0 100%);box-shadow:0 0 14px rgba(25,180,201,.5)}
.brand{display:flex;align-items:center;gap:13px;white-space:nowrap}
.brand .mark{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,#4f46e5,#0891b2);display:flex;align-items:center;justify-content:center;font-size:19px;color:#fff;box-shadow:0 4px 14px rgba(23,165,204,.5)}
.brand .bt{color:#fff;font-weight:800;font-size:15.5px;letter-spacing:3.5px}
.brand .bs{display:block;font-size:9.5px;font-weight:600;letter-spacing:1.2px;color:#8aa2c6;margin-top:1px}
.seg{margin:0 auto;display:inline-flex;background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.13);border-radius:999px;padding:4px;gap:3px;box-shadow:inset 0 1px 2px rgba(0,0,0,.2)}
.seg button{appearance:none;border:none;background:none;cursor:pointer;display:inline-flex;align-items:center;gap:9px;padding:9px 26px;font-size:13.5px;font-weight:700;color:#aabcd8;border-radius:999px;transition:all .2s cubic-bezier(.4,0,.2,1);white-space:nowrap}
.seg button .ic{font-size:15px;line-height:1}
.seg button.on{background:linear-gradient(180deg,#ffffff,#f0f2ff);color:#312e81;box-shadow:0 2px 12px rgba(0,0,0,.3)}
.seg button:not(.on):hover{color:#fff;background:rgba(255,255,255,.07)}
.host{flex:1;position:relative;min-height:0;background:#f5f5fc}
iframe{position:absolute;inset:0;width:100%;height:100%;border:none;background:#f5f5fc;opacity:0;transition:opacity .35s ease}
iframe.shown{opacity:1}
iframe.hide{display:none}
.loader{position:absolute;inset:0;display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;color:#5b6b85;font-size:12.5px;font-weight:600;letter-spacing:.3px;background:#f5f5fc}
.spin{width:30px;height:30px;border-radius:50%;border:3px solid #d2dae8;border-top-color:#2f6bd0;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media(max-width:620px){.brand .bt{font-size:14px;letter-spacing:2px}.brand .bs{display:none}.seg button{padding:9px 15px;font-size:12.5px}.seg button .ic{font-size:14px}}
/* ── Instant iframe switching — no layout reflow ── */
.host{position:relative;width:100%;height:100vh}
#fMgmt,#fFos{position:absolute;inset:0;width:100%;height:100%;border:none;
  opacity:0;pointer-events:none;transition:opacity .3s cubic-bezier(.4,0,.2,1);
  will-change:opacity;contain:strict}
#fMgmt.shown{opacity:1;pointer-events:auto}
#fFos.shown{opacity:1;pointer-events:auto}
#fMgmt.hide,#fFos.hide{opacity:0;pointer-events:none}
#loadMgmt{position:absolute;inset:0;display:flex;align-items:center;
  justify-content:center;gap:14px;font-size:14px;color:#64748b;
  background:#f3f5f8;z-index:10}
</style>
</head>
<body>
<div class="host">
  <div id="loadMgmt" class="loader"><div class="spin"></div><div>Loading dashboard&hellip;</div></div>
  <iframe id="fMgmt" class="hide" title="Management dashboard"></iframe>
  <iframe id="fFos" class="hide" title="FOS dashboard"></iframe>
</div>

function b64ToStr(b64){var bin=atob(b64);var bytes=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);return new TextDecoder('utf-8').decode(bytes);}
var fm=document.getElementById('fMgmt');
var ff=document.getElementById('fFos');
/* Pre-decode both iframes once at startup */
var _mgmtDoc=b64ToStr(B64.mgmt);
var _fosDoc=b64ToStr(B64.fos);
fm.onload=function(){
  var l=document.getElementById('loadMgmt');
  if(l){l.style.display='none';}
  fm.classList.remove('hide');
  fm.classList.add('shown');
  /* Load FOS silently in background after mgmt is ready */
  if(!fosLoaded){setTimeout(function(){ff.srcdoc=_fosDoc;fosLoaded=true;},200);}
};
ff.onload=function(){
  ff.classList.add('shown');
  ff.classList.add('hide'); /* start hidden */
  if(pendingFos)setTimeout(flushFos,100);
};
fm.srcdoc=_mgmtDoc;
var fosLoaded=false,pendingFos=null,_curPane='mgmt';
function flushFos(){if(!pendingFos)return;try{ff.contentWindow.postMessage({type:'selectFos',code:pendingFos.code,name:pendingFos.name},'*');}catch(e){}pendingFos=null;}
function pick(w){
  if(_curPane===w)return;
  _curPane=w;
  var m=(w==='mgmt');
  /* Instant opacity swap — no display/layout change */
  requestAnimationFrame(function(){
    fm.classList.toggle('hide',!m);
    ff.classList.toggle('hide',m);
  });
  if(!m&&!fosLoaded){ff.srcdoc=_fosDoc;fosLoaded=true;}
}
window.addEventListener('message',function(ev){var d=ev.data;if(!d)return;
  if(d.type==='openFos'){pendingFos=d.code?{code:d.code,name:d.name}:null;var was=fosLoaded;pick('fos');if(was&&pendingFos)setTimeout(flushFos,250);}
  else if(d.type==='openMgmt'){pick('mgmt');if(d.level){try{fm.contentWindow.postMessage({type:'setLevel',level:d.level},'*');}catch(e){}}}
  /* Relay: mgmt requests FOS marks → forward to FOS iframe */
  else if(d.type==='requestFosMarks'){
    var ff=document.getElementById('fFos');
    if(ff&&ff.contentWindow){ff.contentWindow.postMessage({type:'getFosMarks',from:d.from,to:d.to,reqId:d.reqId},'*');}
  }
  /* Relay: FOS marks reply → forward to mgmt iframe */
  else if(d.type==='fosMarksReply'){
    var fm2=document.getElementById('fMgmt');
    if(fm2&&fm2.contentWindow){fm2.contentWindow.postMessage({type:'fosMarksReply',marks:d.marks,reqId:d.reqId},'*');}
  }
});
</script>
